[project]
name = "sentinelops-remediation"
version = "0.1.0"
# Lambda durable functions run on Python 3.13 or 3.14 (BUILD_PLAN.md, Phase 4
# design, decision 11).
requires-python = ">=3.13,<3.14"
# Everything is bundled into the zip (build_flow.py): the durable execution
# SDK, the boto3 it pins (so the flow never depends on the runtime's), and
# sentinelops-core with pydantic. GitHub is called with urllib: no HTTP, JWT,
# or crypto library, since the App's key never leaves KMS.
dependencies = [
    "aws-durable-execution-sdk-python==3.1.0",
    "sentinelops-core",
]

[dependency-groups]
# boto3 for botocore's Stubber, which checks each KMS call against the real
# API, and for check_app.py's real calls.
dev = [
    "aws-durable-execution-sdk-python-testing==1.5.0",
    "boto3>=1.43",
    "pytest>=9.1.1",
]

[tool.uv.sources]
sentinelops-core = { path = "../core", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# ../.githooks holds commit_scan.py, the commit hooks' rules, which the
# validation step imports as they are: one copy.
pythonpath = [".", "../.githooks"]
