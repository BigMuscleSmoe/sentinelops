[project]
name = "sentinelops-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43",
    "httpx2>=2.16.0",
    "mcp>=2.1.1",
    "pydantic>=2.11",
    "sentinelops-tools",
    "starlette>=1.10.0",
    "strands-agents[anthropic]==1.62.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
sentinelops-tools = { path = "../tools", editable = true }
