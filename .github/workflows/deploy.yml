name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  TF_VERSION: 1.16.2
  TF_IN_AUTOMATION: "true"

jobs:
  # Runs on PRs and on main. The agent's suite includes the repo-wide rules in
  # test_repo_rules.py. No leg reaches AWS or a model: the tools replay recorded
  # AWS calls, and the agent's loop runs against a scripted Messages API.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [agent, core, tools, services/checkout-api, trigger, remediation]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      # Full history: the tools' tests build the code snapshot from each
      # release's commit (core/sentinelops_core/releases.py), tag and branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -q

  # PRs get no AWS credentials: the OIDC trust only accepts refs/heads/main.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      # The plan reads the runbook sections' manifest, so validate needs it too.
      - name: Build the runbook sections
        working-directory: .
        run: python3 tools/build_runbooks.py
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # Skipped until bootstrap has run and its outputs are set as repo variables.
  deploy:
    needs: test
    if: github.event_name == 'push' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      # Full history, for the code snapshot below.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # The agent's Runtime package, which the apply zips and deploys. This uv
      # is the one that staged the local plan's package, so both stage the same
      # bytes and the apply uploads nothing a local plan didn't show. The build
      # prints the staged folder's SHA-256 to compare.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - name: Build the agent's Runtime package
        working-directory: agent
        run: python3 build_runtime.py

      # The tool functions' packages, which the apply zips, and the read tool's
      # code snapshot: each release's checkout/ read from its own commit, never
      # the working tree. A file that breaks the rules fails the deploy here,
      # before anything changes. Prints the snapshot's SHA-256 to compare.
      - name: Build the tools' packages and the code snapshot
        working-directory: tools
        run: uv run --locked python build_code_snapshot.py

      # The remediation flow's package, which the apply zips: the flow, core,
      # the commit hooks' scanner, and its locked dependencies for Linux arm64
      # and Python 3.13. Prints the staged folder's SHA-256 to compare.
      - name: Build the remediation flow's package
        working-directory: remediation
        run: python3 build_flow.py

      # The knowledge base's documents, one per runbook section, which the apply
      # uploads, and their manifest, which the plan reads. Stdlib only; a runbook
      # that breaks the format fails the deploy here, before anything changes.
      - name: Build the runbook sections
        working-directory: .
        run: python3 tools/build_runbooks.py

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # Federation's IDs for the runtime and the GitHub App's for the
      # remediation flow, each one line of JSON: masked here, and sensitive in
      # Terraform, so no plan prints them. Required: either unset, the apply
      # fails before it changes anything.
      - run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_anthropic_federation: ${{ secrets.ANTHROPIC_FEDERATION }}
          TF_VAR_remediation_app: ${{ secrets.REMEDIATION_APP }}

      # Signed with the deploy role's session: every route requires SigV4. A new
      # route or permission can take a few seconds to start answering. The
      # version must be the one just built, so a stale deploy can't pass.
      - name: Smoke test checkout-api
        run: |
          url="$(terraform output -raw checkout_api_url)/health"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("../services/checkout-api/pyproject.toml", "rb"))["project"]["version"])')
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -sS -o health.json -w '%{http_code}' \
              --aws-sigv4 "aws:amz:${AWS_REGION}:execute-api" \
              --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
              -H "x-amz-security-token: ${AWS_SESSION_TOKEN}" \
              "$url") || status=000
            [ "$status" = 200 ] && break
            echo "attempt $attempt: HTTP $status"
            sleep 10
          done
          cat health.json
          jq -e --arg version "$version" \
            '.status == "ok" and .service == "checkout-api" and .version == $version' health.json

      # Sync the knowledge base with the sections just uploaded, then check it
      # holds exactly this build: every section scanned, none failed, and one
      # search returning all of them and nothing else, each tagged with this
      # build's corpus digest. Prints counts and the digest, never an ID.
      - name: Ingest the runbooks
        working-directory: tools
        run: |
          kb_id=$(terraform -chdir=../infra output -raw runbooks_knowledge_base_id)
          ds_id=$(terraform -chdir=../infra output -raw runbooks_data_source_id)
          uv run --locked python ingest_runbooks.py --knowledge-base-id "$kb_id" --data-source-id "$ds_id"
